name: CI

# Runs the full workspace test suite — this is what backs the "tests are the arbiter" claim
# with a green badge instead of an assertion. Builds every package, then runs each package's
# own `npm test` (build + node --test), matching the commands documented in AGENTS.md.
#
# Node version note: packages/ui and packages/opsui run `node --test test/*.test.ts` directly,
# relying on Node's native TypeScript type-stripping in current Node 22 releases. Every
# publishable workspace declares "engines": { "node": ">=22" }, so CI pins the same proven floor.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      - name: core — build + test
        run: npm test --workspace=packages/core

      - name: console — build + test
        run: npm test --workspace=packages/console

      - name: ui — build + test
        run: npm test --workspace=packages/ui

      - name: opsui — build + test
        run: npm test --workspace=packages/opsui

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browser used by the accessibility gate
        run: npx playwright install --with-deps chromium

      - name: console — real-browser accessibility + interaction gate
        run: npm run test:browser:ci
